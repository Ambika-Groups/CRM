# Ambika Group CRM on Netlify (decisions D-36). The site is the Next.js static export in web/out.
# Base directory is the CRM repo root so npm workspaces (packages/core) install together.

[build]
  command = "npm ci && npm run build:web"
  publish = "web/out"

[build.environment]
  # The Firebase web settings are PUBLIC by design (they are inside every page the site sends, and the security rules, not
  # secrecy, protect the data). Netlify's secret scanner must not fail the build because it finds them in the built output.
  # (Standard scanning only checks variables ticked "Contains secret values"; leave these unticked. This list is a safeguard
  # in case someone ticks one.) Comma-separated key names, per Netlify's secret-scanning settings.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_FIREBASE_API_KEY,NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,NEXT_PUBLIC_FIREBASE_PROJECT_ID,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,NEXT_PUBLIC_FIREBASE_APP_ID,NEXT_PUBLIC_RECAPTCHA_SITE_KEY"
  NODE_VERSION = "24.11.1"
  # The site is a plain static export; the auto-installed Next.js plugin is not needed (QA note, same as the website).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# The /__/auth proxy for Google sign-in (D-35) is written into web/out/_redirects at build time by
# web/scripts/postbuild.mjs, because it needs NEXT_PUBLIC_FIREBASE_PROJECT_ID. Demo builds get none.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Camera for bill photos and geolocation for optional attendance GPS (spec §6.3), our own origin only.
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    # Next.js static export inlines small scripts, and the no-flash theme script is inline, hence 'unsafe-inline'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com https://res.cloudinary.com https://*.r2.cloudflarestorage.com https://*.r2.dev; connect-src 'self' https://www.google.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://*.run.app https://fonts.googleapis.com https://fonts.gstatic.com https://*.r2.cloudflarestorage.com https://api.cloudinary.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://www.google.com/recaptcha/ https://recaptcha.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# A production site must be the real CRM, never the demo: the build STOPS (with a plain message) if the six
# NEXT_PUBLIC_FIREBASE_* variables are missing. Deploy previews and branch deploys do not set this, so demos still work.
[context.production.environment]
  NEXT_PUBLIC_REQUIRE_FIREBASE = "1"
