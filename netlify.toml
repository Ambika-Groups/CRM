# Ambika Group CRM on Netlify (decisions D-36). The site is the Next.js static export in web/out.
# Base directory is the CRM repo root so npm workspaces (packages/core) install together.

[build]
  command = "npm ci && npm run build:web"
  publish = "web/out"

[build.environment]
  NODE_VERSION = "24.11.1"
  # The site is a plain static export; the auto-installed Next.js plugin is not needed (QA note, same as the website).
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# The /__/auth proxy for Google sign-in (D-35) is written into web/out/_redirects at build time by
# web/scripts/postbuild.mjs, because it needs NEXT_PUBLIC_FIREBASE_PROJECT_ID. Demo builds get none.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Camera for bill photos and geolocation for optional attendance GPS (spec §6.3), our own origin only.
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    # Next.js static export inlines small scripts, and the no-flash theme script is inline, hence 'unsafe-inline'.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://*.run.app https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://accounts.google.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
